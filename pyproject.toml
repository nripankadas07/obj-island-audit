[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obj-island-audit"
version = "0.1.0"
description = "Explain edge-connected triangle islands and edge defects in a bounded OBJ mesh."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
obj-island-audit = "obj_island_audit:main"

[tool.setuptools]
py-modules = ["obj_island_audit"]
